version: '3.8'

services:
  api:
    build: .
    container_name: ai_english_api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./data:/app/data
    environment:
      - APP_ENV=production
      - QDRANT_HOST=qdrant
      - USE_LOCAL_LANGUAGETOOL=true
    depends_on:
      - qdrant
      - languagetool

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ai_english_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  languagetool:
    image: erikvl87/languagetool
    container_name: ai_english_languagetool
    ports:
      - "8081:8010"

volumes:
  qdrant_data:
